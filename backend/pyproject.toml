[project]
name = "la-higuera-api"
version = "0.2.0"
description = "API de La Higuera: anuncios, servicios de oficio, perfiles e imágenes sobre Supabase."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"scripts/*" = ["S105", "S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
