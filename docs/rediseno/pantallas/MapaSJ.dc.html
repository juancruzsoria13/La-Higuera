<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mapa de Gran San Juan</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lahiguera/components/bundle.css">
<link rel="stylesheet" href="lh-pages.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="map" style="position: relative; width: 100%; aspect-ratio: 5 / 4; overflow: hidden; border-radius: 16px; border: 1px solid #e1e7f0; background: #eaf0f8; font-family: Figtree, 'Segoe UI', system-ui, sans-serif; color: #10213b">
  <svg viewBox="0 0 800 640" width="100%" height="100%" aria-hidden="true" style="position: absolute; inset: 0; display: block">
    <rect width="800" height="640" fill="#eaf0f8"></rect>
    <path d="M0 42 C 120 20, 220 64, 360 40 S 600 18, 800 46" fill="none" stroke="#cfe3f7" stroke-width="14" stroke-linecap="round"></path>
    <g stroke="#f4f7fc" stroke-width="2">
      <path d="M270 200 H530 M270 230 H530 M270 260 H530 M270 290 H530 M270 350 H530 M270 400 H530 M270 430 H530 M270 460 H530"></path>
      <path d="M290 190 V480 M320 190 V480 M350 190 V480 M405 190 V480 M455 190 V480 M480 190 V480 M510 190 V480"></path>
    </g>
    <rect x="270" y="252" width="50" height="50" rx="8" fill="#d8efe0"></rect>
    <rect x="392" y="292" width="18" height="18" rx="3" fill="#d8efe0"></rect>
    <g fill="none" stroke-linecap="round">
      <rect x="250" y="170" width="300" height="320" rx="70" stroke="#d5deec" stroke-width="12"></rect>
      <rect x="250" y="170" width="300" height="320" rx="70" stroke="#ffffff" stroke-width="8"></rect>
      <path d="M0 320 H800" stroke="#d5deec" stroke-width="11"></path>
      <path d="M0 320 H800" stroke="#ffffff" stroke-width="7"></path>
      <path d="M120 275 H700" stroke="#ffffff" stroke-width="6"></path>
      <path d="M180 370 H640" stroke="#ffffff" stroke-width="6"></path>
      <path d="M430 60 V640" stroke="#d5deec" stroke-width="11"></path>
      <path d="M430 60 V640" stroke="#ffffff" stroke-width="7"></path>
      <path d="M375 90 V600" stroke="#ffffff" stroke-width="6"></path>
    </g>
    <g font-family="Figtree, 'Segoe UI', sans-serif" font-size="15" font-weight="600" fill="#7a8aa3" text-anchor="middle">
      <text x="400" y="110">Chimbas</text>
      <text x="400" y="590">Rawson</text>
      <text x="120" y="350">Rivadavia</text>
      <text x="680" y="350">Santa Lucía</text>
      <text x="470" y="455">Capital</text>
    </g>
    <g font-family="Figtree, 'Segoe UI', sans-serif" font-size="11" font-weight="500" fill="#8a98ad">
      <text x="24" y="311">Av. Libertador</text>
      <text x="438" y="610" transform="rotate(-90 438 610)">Av. Rioja</text>
      <text x="560" y="186">Av. Circunvalación</text>
      <text x="268" y="245">Parque de Mayo</text>
    </g>
  </svg>

  <sc-if value="{{showZone}}" hint-placeholder-val="{{ false }}">
    <div aria-label="Zona aproximada" style="position: absolute; left: 53%; top: 48%; width: 34%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; background: rgba(22, 75, 250, .14); border: 2px dashed #164bfa; box-sizing: border-box"></div>
  </sc-if>

  <sc-for list="{{pins}}" as="p" hint-placeholder-count="6">
    <a href="{{p.href}}" aria-label="{{p.name}}" style="position: absolute; left: {{p.x}}%; top: {{p.y}}%; transform: translate(-50%, -100%); display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none">
      <sc-if value="{{p.selected}}" hint-placeholder-val="{{ false }}">
        <span style="white-space: nowrap; background: #ffffff; color: #10213b; border-radius: 10px; padding: 6px 10px; font: 600 13px/16px Figtree, sans-serif; box-shadow: 0 8px 20px -6px rgba(23, 37, 84, .35)">{{p.name}}</span>
      </sc-if>
      <span style="display: flex; width: {{p.size}}px; height: {{p.size}}px; align-items: center; justify-content: center; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: {{p.color}}; border: 2px solid #ffffff; box-shadow: 0 4px 10px -2px rgba(23, 37, 84, .35)"><span style="width: 8px; height: 8px; border-radius: 50%; background: #ffffff"></span></span>
    </a>
  </sc-for>

  <div style="position: absolute; right: 12px; top: 12px; display: flex; flex-direction: column; overflow: hidden; border-radius: 10px; background: #ffffff; box-shadow: 0 4px 12px rgba(9, 37, 117, .12)">
    <button type="button" aria-label="Acercar" style="width: 40px; height: 40px; border: 0; background: transparent; color: #10213b; font: 500 20px/1 Figtree, sans-serif">+</button>
    <span style="height: 1px; background: #e1e7f0"></span>
    <button type="button" aria-label="Alejar" style="width: 40px; height: 40px; border: 0; background: transparent; color: #10213b; font: 500 20px/1 Figtree, sans-serif">−</button>
  </div>
  <p style="position: absolute; right: 8px; bottom: 6px; margin: 0; font: 400 11px/14px Figtree, sans-serif; color: #596a82; background: rgba(255, 255, 255, .8); padding: 2px 6px; border-radius: 4px">© colaboradores de OpenStreetMap</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["locales","local","zona"],"default":"locales"},"$preview":{"width":800,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    const mode = this.props.mode ?? 'locales';
    const pin = (name, x, y, selected) => ({ name, x, y, selected: !!selected, size: selected ? 36 : 28, color: selected ? '#0a2463' : '#164bfa', href: 'PerfilLocal.dc.html' });
    let pins = [];
    if (mode === 'locales') {
      pins = [
        pin('Corralón El Algarrobo', 19, 47),
        pin('TecnoCuyo', 52.5, 45, true),
        pin('Mueblería San Martín', 45, 55),
        pin('Inmobiliaria Sarmiento', 57, 52),
        pin('Electro Hogar Rawson', 49, 84),
        pin('Boutique Lila', 81, 47)
      ];
    } else if (mode === 'local') {
      pins = [pin('TecnoCuyo', 52.5, 45, true)];
    }
    return { pins, showZone: mode === 'zona' };
  }
}
</script>
</body>
</html>
