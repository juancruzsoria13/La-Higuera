<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Crear cuenta · La Higuera</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/lahiguera/components/bundle.css">
<link rel="stylesheet" href="lh-pages.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..900&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="page" style="font-family: Figtree, 'Segoe UI', system-ui, sans-serif; background: #f5f7fb; color: #10213b">
  <dc-import name="Header" active="ninguna" hint-size="100%,170px"></dc-import>
  <main class="main">
    <div class="shell narrow" style="display: flex; flex-direction: column; gap: 32px">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <h1 class="lh-h1">Sumate a La Higuera</h1>
        <p class="lh-lead lh-muted">Creá tu cuenta y empezá a publicar en San Juan.</p>
      </div>
      <form class="panel panel--form">
        <div class="lh-field">
          <label class="lh-label" for="re-name">Nombre público</label>
          <input class="lh-input" id="re-name" autocomplete="name">
          <p class="lh-caption lh-muted">Es el nombre que se verá en tus anuncios.</p>
        </div>
        <div class="lh-field">
          <label class="lh-label" for="re-email">Correo electrónico</label>
          <input class="lh-input" id="re-email" type="email" autocomplete="email" placeholder="nombre@correo.com">
        </div>
        <div class="lh-field">
          <label class="lh-label" for="re-pass">Contraseña</label>
          <input class="lh-input" id="re-pass" type="password" autocomplete="new-password">
          <p class="lh-caption lh-muted">Al menos 8 caracteres.</p>
        </div>
        <button class="lh-btn lh-btn--primary" type="submit" style="width: 100%">Crear mi cuenta</button>
        <p class="lh-body-sm lh-muted">¿Ya tenés cuenta? <a class="link" href="Ingresar.dc.html">Ingresá</a></p>
      </form>
    </div>
  </main>
  <dc-import name="Footer" hint-size="100%,130px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
